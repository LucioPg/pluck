[package]
name = "ldwhelper"
version = "0.2.2"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
tokio = { version = "1", features = ["sync", "fs", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["stream"] }
rfd = "0.15"
tokio-util = "0.7"
futures-util = "0.3"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"
percent-encoding = "2"
ffmpeg-sidecar = "2.7.0"
m3u8-rs = "6.0.1"
arboard = "3.7.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
