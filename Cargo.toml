[package]
name = "ldwhelper"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
tokio = { version = "1", features = ["sync", "fs", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["stream"] }
rfd = "0.15"
tokio-util = "0.7"
futures-util = "0.3"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
